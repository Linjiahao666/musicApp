# 默认分支推送或手动触发时，先跑测试再打出连已部署 store 的 Android 与 Windows 侧载包。
name: Sideload

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  # 内测包编译期注入的已部署 store 基址。
  STORE_BASE_URL: http://8.163.97.133:10086
  # 与 pubspec 的 Dart 3.6.2 约束对应。
  FLUTTER_VERSION: "3.27.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release --dart-define=STORE_BASE_URL=${{ env.STORE_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release --dart-define=STORE_BASE_URL=${{ env.STORE_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
